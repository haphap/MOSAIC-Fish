services:
  # 图记忆后端：Neo4j Community Edition（取代 Zep Cloud）。
  # CE 即支持向量索引 + 全文索引，足够 MOSAIC-Fish 使用。
  neo4j:
    image: neo4j:5-community
    container_name: mirofish-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mirofishdev}
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-mirofishdev} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mirofish:
    # 从本仓库源码构建（含 Neo4j 图记忆改造）。
    # 上游预构建镜像 ghcr.io/666ghj/mirofish:latest 不含本仓库改动，故不再直接拉取。
    build: .
    image: mosaic-fish:latest
    container_name: mirofish
    env_file:
      - .env
    environment:
      # 容器间通过服务名访问 Neo4j，覆盖 .env 中给「本机直跑」用的 localhost。
      GRAPH_MEMORY_BACKEND: ${GRAPH_MEMORY_BACKEND:-neo4j}
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  neo4j-data:
  neo4j-logs:
